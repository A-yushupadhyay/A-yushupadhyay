<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ayush Upadhyay: Backend Systems, Python, GenAI</title>
  <desc id="d">Profile banner. Rotating highlights: RAG pipelines with guardrails, async workers with retries and dead-letter queues, load-tested APIs.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8b949e" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .t{opacity:0;animation:show 12s infinite}
    .t1{opacity:1}
    .t2{animation-delay:4s}
    .t3{animation-delay:8s}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes show{0%{opacity:0;transform:translateY(6px)}4%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}34%{opacity:0}100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion: reduce){
      .t,.pulse{animation:none}
      .t2,.t3{opacity:0}
      .t1{opacity:1}
    }
  </style>
  <rect x="1" y="1" width="898" height="248" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="248" rx="14" fill="url(#grid)"/>
  <rect x="48" y="62" width="64" height="4" rx="2" fill="url(#bar)"/>

  <circle cx="30" cy="28" r="5" fill="#f85149" fill-opacity="0.8"/>
  <circle cx="48" cy="28" r="5" fill="#d29922" fill-opacity="0.8"/>
  <circle cx="66" cy="28" r="5" fill="#3fb950" fill-opacity="0.8"/>

  <circle class="pulse" cx="596" cy="28" r="5" fill="#3fb950"/>
  <text class="sans" x="612" y="33" font-size="13" fill="#8b949e">Open to SDE-1 · Backend · GenAI roles</text>

  <text class="sans" x="48" y="118" font-size="48" font-weight="700" fill="#e6edf3">Ayush Upadhyay</text>
  <text class="sans" x="48" y="156" font-size="22" fill="#58a6ff">Backend Systems · Python · GenAI</text>

  <g class="mono" font-size="16" fill="#8b949e">
    <text x="48" y="200" fill="#3fb950">&gt;</text>
    <text class="t t1" x="72" y="200">RAG pipelines with guardrails and human review</text>
    <text class="t t2" x="72" y="200">async workers, retries and dead-letter queues</text>
    <text class="t t3" x="72" y="200">load-tested APIs: p99 from 4,800 ms to 28 ms</text>
  </g>
  <text class="mono" x="48" y="228" font-size="13" fill="#6e7681">2026 B.Tech CSE · BIET Jhansi · Noida, open to relocation</text>
</svg>
