<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">LLM Evaluation Platform: experiment run</title>
  <desc id="d">The dashboard calls the FastAPI service, which queues a job in Redis. A worker runs every sample, prompt and model combination through the LLM, scores each output by embedding similarity, stores results in PostgreSQL, and the dashboard shows the leaderboard.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11px;fill:#8b949e;text-anchor:middle}
    .step{font-size:11px;fill:#58a6ff;text-anchor:middle}
    .flow{stroke:#484f58;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    .lane{font-size:12px;fill:#6e7681;letter-spacing:.08em}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="328" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans" x="28" y="34" font-size="14" fill="#8b949e">Distributed LLM Evaluation Platform · one experiment run</text>
  <g class="sans">
    <path class="flow dash" d="M190 100H246" marker-end="url(#ah)"/>
    <path class="flow dash" d="M400 100H456" marker-end="url(#ah)"/>
    <path class="flow dash" d="M610 100H666" marker-end="url(#ah)"/>
    <path class="flow dash" d="M745 138V188" marker-end="url(#ah)"/>
    <path class="flow dash" d="M670 230H614" marker-end="url(#ah)"/>
    <path class="flow dash" d="M460 230H404" marker-end="url(#ah)"/>
    <path class="flow dash" d="M250 230H194" marker-end="url(#ah)"/>
    <path class="flow dash" d="M115 192V142" marker-end="url(#ah)"/>
  </g>
  <circle r="5" fill="#58a6ff">
    <animateMotion dur="10s" begin="0s" repeatCount="indefinite" path="M190 100H745V230H115V100" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.8;0.8200000000000001;1" dur="10s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#3fb950">
    <animateMotion dur="10s" begin="5s" repeatCount="indefinite" path="M190 100H745V230H115V100" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.8;0.8200000000000001;1" dur="10s" begin="5s" repeatCount="indefinite"/>
  </circle>
  <g class="sans">
    <rect class="node" x="40" y="62" width="150" height="76" rx="10"/><text class="step" x="115.0" y="79">1</text><text class="name" x="115.0" y="104.0">Dashboard</text><text class="cap" x="115.0" y="126">React + Recharts</text>
    <rect class="node" x="250" y="62" width="150" height="76" rx="10"/><text class="step" x="325.0" y="79">2</text><text class="name" x="325.0" y="104.0">API</text><text class="cap" x="325.0" y="126">FastAPI · REST</text>
    <rect class="node" x="460" y="62" width="150" height="76" rx="10"/><text class="step" x="535.0" y="79">3</text><text class="name" x="535.0" y="104.0">Queue</text><text class="cap" x="535.0" y="126">Redis · blocking BRPOP</text>
    <rect class="node" x="670" y="62" width="150" height="76" rx="10" style="stroke:#58a6ff"/><text class="step" x="745.0" y="79">4</text><text class="name" x="745.0" y="104.0">Worker</text><text class="cap" x="745.0" y="126">sample × prompt × model</text>
    <rect class="node" x="670" y="192" width="150" height="76" rx="10"/><text class="step" x="745.0" y="209">5</text><text class="name" x="745.0" y="234.0">LLM call</text><text class="cap" x="745.0" y="256">BaseLLM: OpenAI or mock</text>
    <rect class="node" x="460" y="192" width="150" height="76" rx="10"/><text class="step" x="535.0" y="209">6</text><text class="name" x="535.0" y="234.0">Score</text><text class="cap" x="535.0" y="256">MiniLM similarity</text>
    <rect class="node" x="250" y="192" width="150" height="76" rx="10"/><text class="step" x="325.0" y="209">7</text><text class="name" x="325.0" y="234.0">PostgreSQL</text><text class="cap" x="325.0" y="256">results, latency, cost</text>
    <rect class="node" x="40" y="192" width="150" height="76" rx="10" style="stroke:#3fb950"/><text class="step" x="115.0" y="209">8</text><text class="name" x="115.0" y="234.0">Leaderboard</text><text class="cap" x="115.0" y="256">avg score per config</text>
  </g>
  <text class="sans" x="28" y="298" font-size="12" fill="#8b949e">The API never blocks on LLM calls: it enqueues a job and the worker processes it independently.</text>
  <text class="sans" x="28" y="316" font-size="12" fill="#8b949e">Failed jobs are marked failed, never silently lost. Mock mode runs the whole pipeline without API credits.</text>
</svg>
