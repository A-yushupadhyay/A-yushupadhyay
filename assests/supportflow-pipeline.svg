<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SupportFlow AI ticket lifecycle</title>
  <desc id="d">A ticket is classified, relevant knowledge is retrieved, a grounded reply is generated, and deterministic rules decide between auto-resolution and escalation to a human agent.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11.5px;fill:#8b949e;text-anchor:middle}
    .step{font-size:11px;fill:#58a6ff;text-anchor:middle}
    .flow{stroke:#30363d;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="288" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans" x="28" y="34" font-size="14" fill="#8b949e">SupportFlow AI · ticket lifecycle</text>

  <!-- connectors -->
  <g>
    <path class="flow dash" d="M134 135H170"/>
    <path class="flow dash" d="M280 135H316"/>
    <path class="flow dash" d="M426 135H462"/>
    <path class="flow dash" d="M572 135H608"/>
    <path class="flow" d="M718 135C742 135 742 78 766 78"/>
    <path class="flow" d="M718 135C742 135 742 192 766 192"/>
  </g>

  <!-- nodes -->
  <g class="sans">
    <rect class="node" x="24" y="100" width="110" height="70" rx="10"/>
    <text class="step" x="79" y="120">1</text><text class="name" x="79" y="146">Ticket</text>
    <rect class="node" x="170" y="100" width="110" height="70" rx="10"/>
    <text class="step" x="225" y="120">2</text><text class="name" x="225" y="146">Classify</text>
    <rect class="node" x="316" y="100" width="110" height="70" rx="10"/>
    <text class="step" x="371" y="120">3</text><text class="name" x="371" y="146">Retrieve</text>
    <rect class="node" x="462" y="100" width="110" height="70" rx="10"/>
    <text class="step" x="517" y="120">4</text><text class="name" x="517" y="146">Generate</text>
    <rect class="node" x="608" y="100" width="110" height="70" rx="10" stroke="#58a6ff"/>
    <text class="step" x="663" y="120">5</text><text class="name" x="663" y="146">Decide</text>

    <rect x="766" y="52" width="110" height="52" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/>
    <text class="name" x="821" y="83" style="fill:#3fb950;font-size:13px">Auto-resolved</text>
    <rect x="766" y="166" width="110" height="52" rx="10" fill="#2b2110" stroke="#d29922" stroke-width="1.5"/>
    <text class="name" x="821" y="197" style="fill:#d29922;font-size:13px">Escalated</text>

    <!-- captions -->
    <text class="cap" x="79" y="192">intake API</text>
    <text class="cap" x="79" y="208">rate limited</text>
    <text class="cap" x="225" y="192">Gemini JSON mode</text>
    <text class="cap" x="225" y="208">Pydantic-validated</text>
    <text class="cap" x="371" y="192">embeddings + cosine</text>
    <text class="cap" x="371" y="208">top-3, score &#8805; 0.62</text>
    <text class="cap" x="517" y="192">answers only from</text>
    <text class="cap" x="517" y="208">retrieved documents</text>
    <text class="cap" x="663" y="192">8 deterministic rules</text>
    <text class="cap" x="663" y="208">no LLM in the decision</text>
    <text class="cap" x="821" y="238">to a human agent</text>
  </g>

  <text class="sans" x="28" y="268" font-size="12" fill="#8b949e">If no relevant document is retrieved, the LLM is never called and the ticket escalates. Every step is written to an audit log.</text>

  <!-- packets: one resolves, one escalates -->
  <circle r="5" fill="#3fb950">
    <animateMotion dur="6s" repeatCount="indefinite" path="M79 135H718C742 135 742 78 766 78H821" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#d29922">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M79 135H718C742 135 742 192 766 192H821" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="6s" begin="3s" repeatCount="indefinite"/>
  </circle>
</svg>
